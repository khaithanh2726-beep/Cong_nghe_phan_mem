services:
  db:
    image: mysql:8.0
    container_name: autovoice_mysql
    restart: always
    environment:
      MYSQL_DATABASE: 'autovoice_db'
      MYSQL_ROOT_PASSWORD: 'rootpassword'
      MYSQL_USER: 'db_user'
      MYSQL_PASSWORD: 'db_password'
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autovoice_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_URL: 'jdbc:mysql://db:3306/autovoice_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true'
      DB_USERNAME: 'db_user'
      DB_PASSWORD: 'db_password'
      JWT_SECRET: 'autovoice-super-secret-key-2026-cnpm-project-256bits'
      JWT_EXPIRATION: '86400000'
    depends_on:
      - db
    volumes:
      - ./uploads:/app/uploads

volumes:
  mysql_data:

server.port=8080

# Database — dùng biến môi trường, fallback về giá trị mặc định khi dev local
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/autovoice_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Infineti2006.}

# JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT — thay secret bằng biến môi trường trước khi deploy production
jwt.secret=${JWT_SECRET:autovoice-super-secret-key-2026-cnpm-project-256bits}
jwt.expiration=${JWT_EXPIRATION:86400000}

# File upload giới hạn 100MB
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Springdoc / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html